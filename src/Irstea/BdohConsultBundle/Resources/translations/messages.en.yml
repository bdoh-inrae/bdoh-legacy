# The page of a reserved time series, for those without the right (Chronique/reserved.html.twig; Lou, 2026-11-19)
reserved:
    subtitle: Time series reserved for the observatory
    what: This time series is reserved for the members of the observatory, for its internal work.
    distribution: "BDOH does not distribute it: to obtain it, please contact the partners who do."
    producer(%producer%): "Its producer: %producer%."
    station(%station%): Its metadata stay visible on the page of its station, %station%.
    managers(%link%): To learn more about this time series, you can write to the <a href="%link%">managers</a> of the observatory.
    member:
        login(%link%): A member of the observatory? <a href="%link%">Sign in</a>, then request access from your account menu.
        connected: A member of the observatory? Request access from your account menu.
# Usage statistics (Statistics\Usage, StatisticsController; Lou, 2026-11-12 and 16)
usage:
    title: Metrics
    views: "{1} view|[0,Inf[ views"
    viewsSince(%date%): since %date%
    downloads: "{1} download|[0,Inf[ downloads"
    downloadsSince(%year%): since %year%
    help: >-
        A view: this page opened, counted once per hour and per visitor, robots excluded.
        A download: an export of this series.
statistics:
    title: Usage statistics
    menu: Statistics
    allBdoh: All of BDOH
    intro: >-
        What the history of BDOH tells of the life of the observatory, since February 2013, and what the view counter
        counts, since it was put in service. A download is the export of one time series: an export of several time
        series counts for each. A view is the opening of the page of a time series, counted once an hour per visitor,
        without robots, following the rules of COUNTER.
    seeAll: See all of BDOH
    seeObservatory(%name%): See %name% only
    byYear: By year
    bySeries: By time series, all years together
    csv: Download this table (CSV)
    csvBySeries: Download the detail by time series and by year (CSV)
    notes: >-
        Before the data were opened, every export required an account: the accounts that downloaded tell how many people
        used them. Since then, an export can also be done without an account, and the column of exports without an
        account counts them. A deleted time series counts in this table, no longer in the next one, and its views
        go with it; an export by an account deleted since reads as without an account.
    columns:
        year: Year
        accounts_created: Accounts created
        stations_created: Stations created
        series_created: Time series created
        imports: Imports of values
        imported_values: Values imported
        checkpoint_imports: Imports of checkpoints
        computations: Computations and conversions
        downloads: Time series downloaded
        downloaded_values: Values downloaded
        downloading_accounts: Accounts that downloaded
        anonymous_requests: Exports without an account
        views: Views
        observatory: Observatory
        station: Station
        series: Time series
