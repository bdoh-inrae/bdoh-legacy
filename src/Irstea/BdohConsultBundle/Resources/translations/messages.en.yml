emptyChroniqueContinueInfo: >+
    For a continuous time series the removal period is inclusive, all the data points over the
    period will be replaced by gap values unless the removal period includes a boundary of the time series,
    in which case the data points are removed.
emptyChroniqueDiscontinueInfo: >+
    For a discontinuous time series, the removal period includes all the data ranges that overlap
    the removal period except for the data that overlap the period
    only on one boundary and which are not a point. The data ranges concerned are removed
    entirely; they are not truncated.
