parameters:
    irstea_bdoh_data.measure_export.document_base_path: "%kernel.project_dir%/public"

    # The description file of measures export formats (relative to the web dir)
    irstea_bdoh_data.measure_export.formats_export_file: documents/FormatsExport.pdf

    # The description file of measures export formats (relative to the web dir)
    irstea_bdoh_data.measure_export.default_termofuses_file: documents/ConditionsGeneralesUtilisation.pdf

    # La licence des chroniques visibles, ses textes officiels, français et anglais (dev/decisions.md)
    irstea_bdoh_data.measure_export.open_licence_files:
        - documents/Licence-Ouverte-2.0-fr.pdf
        - documents/Open-Licence-2.0-en.pdf

    # La place des archives d'export en attente d'être téléchargées : 20 Go par défaut (ExportFiles)
    env(EXPORTS_MAX_BYTES): '21474836480'
    # Les seuils de volume d'un export, en valeurs écrites (ExportController, .env.example) : valeurs lues (à
    # l'identique, interpolées) et valeurs calculées (moyenne, cumul), sans compte, puis par demande
    env(EXPORT_READ_WITHOUT_ACCOUNT): '5000000'
    env(EXPORT_READ_MAX): '50000000'
    env(EXPORT_COMPUTED_WITHOUT_ACCOUNT): '100000'
    env(EXPORT_COMPUTED_MAX): '1200000'

    # A map of formats and their specific exporters
    irstea_bdoh_data.measure_export.exporters:
        # General
        Bdoh      : Irstea\BdohDataBundle\Exporter\Measure\BdohExporter
        Qtvar     : Irstea\BdohDataBundle\Exporter\Measure\QtvarExporter

     # A map of formats for discontinuous chronicles and their specific exporters
    irstea_bdoh_data.measure_discontinuous_export.exporters:
        # General
        Bdoh      : Irstea\BdohDataBundle\Exporter\Measure\BdohExporter

    # Les valeurs exactes qu'un graphique reçoit au plus ; au-delà, le minimum et le maximum de chaque tranche
    # (ChroniqueContinueRepository), et le graphique se dit allégé. GRAPH_MAX_POINTS, dans .env
    env(GRAPH_MAX_POINTS): '5000'
    irstea_bdoh_data.viewers.max_valid_display_points: '%env(int:GRAPH_MAX_POINTS)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Irstea\BdohDataBundle\Controller\:
        resource: '../../Controller/'

    Irstea\BdohDataBundle\Exporter\Measure\ExportFiles: ~

    # Les commandes de la console, dont celles que lance la file de tâches
    Irstea\BdohDataBundle\Command\:
        resource: '../../Command/'

    # Les écouteurs de MEASURES_UPDATE
    Irstea\BdohDataBundle\EventListener\:
        resource: '../../EventListener/'
        exclude: '../../EventListener/MeasuresUpdateEvent.php'

    # L'export des mesures : le constructeur et ses fabriques, qui créent le reste
    Irstea\BdohDataBundle\Exporter\Measure\ExporterBuilder: ~
    Irstea\BdohDataBundle\Exporter\Measure\Extractor\Factory: ~
    Irstea\BdohDataBundle\Exporter\Measure\Formatter\Factory: ~

    # Écouteurs d'entités, déclarés dans la correspondance d'Observatoire et de Partenaire
    Irstea\BdohDataBundle\Doctrine\Listener\DocumentedEntityListener:
        tags: [doctrine.orm.entity_listener]
    Irstea\BdohDataBundle\Doctrine\Listener\ObservatoireStylesheetListener:
        tags: [doctrine.orm.entity_listener]
