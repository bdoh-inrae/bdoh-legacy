; La couverture du PHP, le temps d'une passe (dev/coverage/README.md). Monté dans le conf.d d'Apache et de la
; ligne de commande. Opcache coupé par prudence : garder le code compilé d'une requête à l'autre n'a pas été mesuré.
pcov.enabled=1
pcov.directory=/var/www/bdoh/src
pcov.initial.files=2048
opcache.enable=0
opcache.enable_cli=0
auto_prepend_file=/var/www/bdoh/dev/coverage/prepend.php
