# Le site de l'application : public/index.php répond à toute adresse qui n'est pas un fichier.
<VirtualHost *:80>
    DocumentRoot /var/www/bdoh/public
    <Directory /var/www/bdoh/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>
