monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# Comme l'ancien BDOH (app/config/config_prod.yml) : les erreurs, avec les messages qui les
# précèdent, dans var/log/prod-AAAA-MM-JJ.log ; les connexions dans var/log/security-….log ; dix
# fichiers de chaque. Rien sur la sortie d'erreur, que la file de tâches garde avec chaque tâche
# et que ses pages affichent ; ni les dépréciations, ni les erreurs 404 et 405 des robots.
when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 10
            security:
                type: rotating_file
                path: "%kernel.logs_dir%/security.log"
                level: info
                channels: [security]
                max_files: 10
