# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Comme l'ancien : sessions de PHP ; Debian les nettoie lui-même, d'où gc_probability à 0.
    session:
        handler_id: null
        gc_probability: 0

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
