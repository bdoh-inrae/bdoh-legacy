# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # L'adresse de chaque fichier servi porte sa date, pour qu'une mise à jour ne reste pas cachée derrière le cache
    # du navigateur (FileDateVersionStrategy)
    assets:
        version_strategy: Irstea\BdohBundle\Asset\FileDateVersionStrategy

    # Comme l'ancien : sessions de PHP ; Debian les nettoie lui-même, d'où gc_probability à 0.
    session:
        handler_id: null
        gc_probability: 0

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
