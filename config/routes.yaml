# Les routes, dans l'ordre de app/config/routing.yml de l'ancien BDOH : la première qui correspond
# l'emporte, et celles de BdohBundle, dont l'accueil, restent les dernières. Les traductions pour le
# JavaScript (/translations/…) viennent de config/routes/js_translation.yaml.
irstea_bdoh_internationalisation:
    resource: "@IrsteaBdohInternationalisationBundle/Resources/config/routing.yml"

observatoires:
    resource: routes_observatory.yaml
    prefix:   /{_observatoire}
    requirements:
        _observatoire: '[A-Z0-9_-]+'

# Les pages du compte sur le portail, sans observatoire (Security/AccountRoutes.php), gardées par le pare-feu
# « portal » de config/packages/security.yaml (2026-11-12, Lou)
bdoh_portal_login:
    path: /login
    controller: Irstea\BdohSecurityBundle\Controller\SecurityController::loginAction
    methods: [GET]
bdoh_portal_login_send:
    path: /login
    controller: Irstea\BdohSecurityBundle\Controller\SecurityController::sendLoginLinkAction
    methods: [POST]
bdoh_portal_login_check:
    path: /login_check
    controller: Irstea\BdohSecurityBundle\Controller\SecurityController::checkLoginLinkAction
    methods: [GET, POST]
bdoh_portal_user_new:
    path: /user/new
    controller: Irstea\BdohSecurityBundle\Controller\UtilisateurController::newAction
    methods: [GET, POST]
bdoh_portal_logout:
    path: /logout
    methods: [GET]
# Les favoris d'un compte, qui traversent les observatoires (dev/plans/2026-11-12_favorites.md) ; l'étoile et la
# fenêtre d'export sont sous l'adresse d'un observatoire (FavoriteController)
bdoh_portal_favorites:
    path: /favorites
    controller: Irstea\BdohSecurityBundle\Controller\FavoriteController::listAction
    methods: [GET, POST]

irstea_bdoh_main:
    resource: "@IrsteaBdohBundle/Controller/"
    type:     attribute
