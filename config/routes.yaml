# Les routes, dans l'ordre de app/config/routing.yml de l'ancien BDOH : la première qui correspond
# l'emporte, et celles de BdohBundle, dont l'accueil, restent les dernières. Les traductions pour le
# JavaScript (/translations/…) viennent de config/routes/js_translation.yaml.
irstea_bdoh_internationalisation:
    resource: "@IrsteaBdohInternationalisationBundle/Resources/config/routing.yml"

observatoires:
    resource: routes_observatory.yaml
    prefix:   /{_observatoire}
    requirements:
        _observatoire: '[A-Z0-9_-]+'

irstea_bdoh_main:
    resource: "@IrsteaBdohBundle/Controller/"
    type:     attribute
