# Le site d'une instance de BDOH, écrit par make vm-apache dans /etc/apache2/sites-available/bdoh-@NOM@.conf.
# @NAME@ : le nom de DEFAULT_URI, dans .env.
#
# Trois sites : le port 80, qui renvoie vers https ; le 443, qui termine le HTTPS et passe tout à Anubis
# (127.0.0.1:8923, make vm-anubis), qui écarte les robots d'IA ; et BDOH lui-même, que seul Anubis joint, sur
# 127.0.0.1:3001 (dev/plans/2026-11-26_ai-robots.md, d'après la documentation d'Anubis pour Apache).

# Le certificat du nom public, demandé à Let's Encrypt et renouvelé par mod_md, que make vm-certificate active.
# Le nom se valide par le 443 (tls-alpn-01) : le 80, fermé depuis Internet jusqu'au 25 novembre 2026, ne sert
# qu'à renvoyer vers https (plus bas). mod_md exige un contact.
# Ses comptes et ses certificats vont sous /var : le service Apache d'Ubuntu 26.04 rend /etc en lecture seule
# (ProtectSystem=full), et sans place où écrire, Apache s'arrête au rechargement.
<IfModule md_module>
    MDStoreDir /var/lib/apache2/md
    <MDomain @NAME@>
        MDCAChallenges tls-alpn-01
        MDCertificateAgreement accepted
        MDContactEmail bdoh.support@listes.inrae.fr
    </MDomain>
</IfModule>

# Le port 80 renvoie tout au site en https, chemin compris : le nom tapé seul, un lien en http. Seul site du
# port, il répond aussi à une adresse IP ou à un autre nom, à la place de la page par défaut d'Ubuntu.
<VirtualHost *:80>
    ServerName @NAME@
    Redirect permanent / https://@NAME@/
    ErrorLog ${APACHE_LOG_DIR}/bdoh-@NOM@-error.log
    CustomLog ${APACHE_LOG_DIR}/bdoh-@NOM@-access.log combined
</VirtualHost>

<VirtualHost *:@PORT@>
    ServerName @NAME@

    SSLEngine on
    <IfModule md_module>
        Protocols http/1.1 acme-tls/1
    </IfModule>
    # Sans mod_md, le certificat auto-signé du paquet ssl-cert
    <IfModule !md_module>
        SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
        SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    </IfModule>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options nosniff
    Header always set Referrer-Policy strict-origin-when-cross-origin

    # Tout passe par Anubis. Il lit l'adresse du visiteur dans X-Real-IP, posé ici quoi qu'envoie le visiteur, et
    # la transmet à BDOH ; X-Forwarded-Proto dit à BDOH qu'il est servi en https
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    RequestHeader set X-Forwarded-Proto https
    RequestHeader set X-Http-Version "%{SERVER_PROTOCOL}s"
    RequestHeader set X-TLS-SNI-Name "%{SSL_TLS_SNI}s"
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyVia Off
    ProxyPass / http://127.0.0.1:8923/
    ProxyPassReverse / http://127.0.0.1:8923/

    # Le mot de passe d'accès des essais, sur tout le site : à retirer à l'ouverture au public
    <Location />
        AuthType Basic
        AuthName "BDOH, essais"
        AuthUserFile /etc/apache2/bdoh-@NOM@.htpasswd
        Require valid-user
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/bdoh-@NOM@-error.log
    CustomLog ${APACHE_LOG_DIR}/bdoh-@NOM@-access.log combined
</VirtualHost>

# BDOH, sur l'interface locale : seul Anubis le joint. L'adresse du visiteur vient de X-Real-IP (mod_remoteip,
# InternalProxy pour garder les adresses privées du VPN), le https de X-Forwarded-Proto : BDOH voit l'une et l'autre
# sans SYMFONY_TRUSTED_PROXIES.
Listen 127.0.0.1:3001
<VirtualHost 127.0.0.1:3001>
    ServerName @NAME@
    DocumentRoot /var/www/bdoh-@NOM@/public

    RemoteIPHeader X-Real-IP
    RemoteIPInternalProxy 127.0.0.1
    SetEnvIf X-Forwarded-Proto ^https$ HTTPS=on

    # Un cookie ne dépend pas du port : chaque instance a le sien
    php_admin_value session.name BDOH@NOM@

    <Directory /var/www/bdoh-@NOM@/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Ce qui atteint BDOH, l'adresse du visiteur en tête (%a)
    ErrorLog ${APACHE_LOG_DIR}/bdoh-@NOM@-error.log
    CustomLog ${APACHE_LOG_DIR}/bdoh-@NOM@-app-access.log "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\""
</VirtualHost>
