# Réglages de PostgreSQL pour BDOH, à la mémoire de la VM (11 Gio visibles) ; installés par make vm-deps
# dans /etc/postgresql/18/main/conf.d/bdoh.conf. À reprendre si la mémoire change : shared_buffers vers
# le quart, effective_cache_size vers les deux tiers.
shared_buffers = 3GB
effective_cache_size = 7GB
work_mem = 64MB
maintenance_work_mem = 512MB
