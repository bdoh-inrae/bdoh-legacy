# Administration, module 6 du portage (ROADMAP.md).
# Routes d'attente : mêmes noms, adresses et valeurs par défaut que l'ancien BDOH, elles répondent
# « pas encore porté » (App\Controller\PendingController) jusqu'au portage du module. Tirées de
# « app/console debug:router » de la référence.

bdoh_admin_colors:
    path: '/colors/{jeuQualiteId}'
    controller: App\Controller\PendingController
    defaults:
        jeuQualiteId: ''
    requirements:
        jeuQualiteId: '\d+'
    methods: [GET]

bdoh_admin_colors_form:
    path: '/colors'
    controller: App\Controller\PendingController
    methods: [POST]

bdoh_admin_conversion:
    path: '/conversion/{chroniqueConvertieId}'
    controller: App\Controller\PendingController
    defaults:
        chroniqueConvertieId: ''
    requirements:
        chroniqueConvertieId: '\d+'
    methods: [GET]

bdoh_admin_conversion_form:
    path: '/conversion'
    controller: App\Controller\PendingController
    methods: [POST]

bdoh_admin_recalculate:
    path: '/fillingrate'
    controller: App\Controller\PendingController
    methods: [GET]
