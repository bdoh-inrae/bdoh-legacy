# Les services de l'application. Ceux de chaque bundle sont dans son Resources/config/services.yml,
# importé ici, comme dans l'ancien BDOH.
imports:
    - { resource: '../src/Irstea/BdohBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohDataBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohAdminBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohConsultBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohInternationalisationBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohSecurityBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohLoggerBundle/Resources/config/services.yml' }
    - { resource: '../src/Irstea/BdohTheiaOzcarBundle/Resources/config/services.yml' }

# Repris des paramètres de app/config/config.yml de l'ancien BDOH
parameters:
    locale: fr

    # Logos des pages (parameters.yml.dist de l'ancien)
    logo_long_web_link: images/Logo_INRAE_REPUBLIQUE.png
    logo_short_web_link: images/Logo_INRAE.png
    mini_logo_sonata: images/MiniLogo_INRAE_REPUBLIQUE.png

    # Le portail Theia/OZCAR, dont l'administration interroge le thésaurus (parameters.yml.dist de l'ancien)
    uri_theia_ozcar: https://in-situ.theia-land.fr
    # Clé des mots de passe Theia, chiffrés en base (.env.example)
    theia_password_secret_key: '%env(THEIA_PASSWORD_SECRET_KEY)%'

    absent_quality_codes:
        VALID:     a
        Hydro2:    0

    # Format is
    #   time_series_sampling:
    #       samplings: [sampling_1, sampling_2]  that is, allowed samplings at export
    #       steps: [[value_1, unit_1], [value_2, unit_2], ...]  that is, allowed time steps at export
    default_allowed_exports:
        instantaneous:
            samplings: ['instantaneous', 'mean']
            steps: [[1, 'hour'], [6, 'hour'], [1, 'day'], [1, 'month'], [1, 'year'], [1, 'event']]
        mean:
            samplings: ['mean', 'cumulative']
            steps: [[1, 'day'], [1, 'month'], [1, 'year'], [1, 'event']]
        cumulative:
            samplings: ['cumulative']
            steps: [[1, 'day'], [1, 'month'], [1, 'year'], [1, 'event']]

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Controller\:
        resource: '../src/Controller/'
